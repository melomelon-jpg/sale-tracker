name: 日次価格取得とサイト生成

on:
  schedule:
    # 毎日 03:00 UTC（日本時間 12:00）に実行
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write   # data/・public/ の変更をコミットするため

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データ取得（ITAD/Steam）
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python src/fetch_data.py

      - name: サイト生成
        run: python src/build_site.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップ。"
          else
            git commit -m "chore: 日次価格更新 $(date -u +%Y-%m-%d)"
            git push
          fi
